[project]
name = "personal-todo-app"
version = "0.1.0"
description = "A cross-platform desktop GUI todo application"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "customtkinter>=5.2.0",
    "sqlmodel>=0.0.22",
    "darkdetect>=0.8.0",
    "tkcalendar>=1.6.1",
    "python-dateutil>=2.9.0.post0",
    "plyer>=2.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
